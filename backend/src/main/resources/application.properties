spring.application.name=assistentia-backend

server.port=${SERVER_PORT:8081}

app.environment=${APP_ENVIRONMENT:local}
app.version=${APP_VERSION:0.0.1-SNAPSHOT}
app.open-browser=${OPEN_BROWSER:true}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/assistentia;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
